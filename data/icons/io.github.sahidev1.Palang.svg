<?xml version="1.0" encoding="UTF-8"?>
<!-- Palang app icon (placeholder): code brackets on a dark tile, with
     amber leopard spots ("palang" is Persian for leopard). -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/>
      <stop offset="1" stop-color="#23262e"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#tile)"/>
  <!-- Leopard spots -->
  <g fill="#e5a50a" opacity="0.9">
    <ellipse cx="30" cy="30" rx="7" ry="5" transform="rotate(-20 30 30)"/>
    <ellipse cx="98" cy="28" rx="6" ry="4.5" transform="rotate(15 98 28)"/>
    <ellipse cx="100" cy="98" rx="7" ry="5" transform="rotate(-10 100 98)"/>
    <ellipse cx="28" cy="100" rx="5.5" ry="4" transform="rotate(25 28 100)"/>
  </g>
  <!-- </> -->
  <g fill="none" stroke="#f6f5f4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="48,44 28,64 48,84"/>
    <polyline points="80,44 100,64 80,84"/>
    <line x1="70" y1="38" x2="58" y2="90" stroke="#e5a50a"/>
  </g>
</svg>
